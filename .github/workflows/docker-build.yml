name: Docker Build and Push

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # `latest` is only published from the default branch (main). Pushing a test
    # branch or a v* tag publishes a tag named after the ref WITHOUT touching the
    # daily-driver `latest` image, so we can validate a new build before promoting.
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          moltowski/comfyui-ltx
          ghcr.io/moltowski/comfyui-ltx
        # Disable metadata-action's default `latest=auto`; we control `latest`
        # explicitly with a GitHub ref expression so a test branch or tag build
        # can NEVER overwrite the daily-driver `latest` image.
        flavor: |
          latest=false
        tags: |
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=ref,event=branch
          type=ref,event=tag

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
