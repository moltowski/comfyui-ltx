name: Docker Build and Push

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'prod-*' ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Two protected pointers, both moved only on purpose:
    #  - `latest`  = published ONLY from the default branch (main). A test branch
    #    or a v* tag publishes a tag named after the ref WITHOUT touching it, so we
    #    can validate a new build before promoting.
    #  - `prod`    = the pinned image production runs. Published ONLY when a
    #    `prod-*` git tag is pushed (e.g. `git tag prod-2026-08-31 && git push --tags`).
    #    That same push also produces the immutable `prod-2026-08-31` tag via
    #    type=ref, so `prod` is a moving pointer to a dated, reproducible build.
    #    A routine push to main can NEVER move `prod`.
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          moltowski/comfyui-prod
          ghcr.io/moltowski/comfyui-prod
        # Disable metadata-action's default `latest=auto`; we control `latest` and
        # `prod` explicitly with GitHub ref expressions so no build can overwrite
        # either pointer by accident.
        flavor: |
          latest=false
        tags: |
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=raw,value=prod,enable=${{ startsWith(github.ref, 'refs/tags/prod-') }}
          type=ref,event=branch
          type=ref,event=tag

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
